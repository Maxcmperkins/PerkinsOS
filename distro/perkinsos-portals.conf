# Which "portal" backend answers apps on the PerkinsOS desktop.
#
# A portal is a service a sandboxed app (a snap or flatpak, such as Ubuntu's
# Firefox) asks for things it may not do itself: show a file open or save
# dialog, take a screenshot, open a link. xdg-desktop-portal receives the
# request and passes it to a backend that draws the actual dialog. It picks
# the backend from the file named after the desktop: XDG_CURRENT_DESKTOP is
# "PerkinsOS" (set in perkinsos-start), so it reads perkinsos-portals.conf.
# We have no backend of our own yet, so use the GTK one for everything.
[preferred]
default=gtk
