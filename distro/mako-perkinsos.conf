# A "drop-in" for mako.service: systemd reads the package's mako.service,
# then this, and settings here win. It gives notifications the HUD style
# (distro/mako.config) unless you have a mako config of your own: mako
# only reads ~/.config/mako/config, with no system-wide file.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'own="$${XDG_CONFIG_HOME:-$$HOME/.config}/mako/config"; \
	if [ -f "$$own" ]; then exec /usr/bin/mako; fi; \
	exec /usr/bin/mako --config @PREFIX@/share/perkinsos/mako.config'
