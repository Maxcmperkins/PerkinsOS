# PerkinsOS settings for the foot terminal: the HUD theme.
# foot reads this file when the user has no ~/.config/foot/foot.ini.
# Colours are RRGGBB; the same greens as shell/common/theme.h.

[main]
font=DejaVu Sans Mono:size=9
pad=6x6

[colors]
background=010603
foreground=33ff66
# The 8 standard colours programs use for coloured output (ls, errors...),
# shifted towards the theme but kept distinguishable.
regular0=010603
regular1=ff5544
regular2=33ff66
regular3=ccdd44
regular4=44aa88
regular5=88cc66
regular6=66ddaa
regular7=99e6ad
bright0=175f2c
bright1=ff7766
bright2=66ff8c
bright3=ddee66
bright4=66ccaa
bright5=aadd88
bright6=88eebb
bright7=ccffd9

[csd]
# foot draws its own title bar (client-side decoration). Colours here are
# AARRGGBB: the first two digits are opacity.
size=24
color=ff04170a
button-color=ff33ff66
button-minimize-color=ff04170a
button-maximize-color=ff04170a
button-close-color=ff04170a
