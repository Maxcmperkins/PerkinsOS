# On every push and pull request: build the image from scratch and boot it
# (boot), and build the desktop on Ubuntu, the way the USB stick has it
# (distro).
name: CI

on:
  push:
  pull_request:

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qemu-system-x86 \
            unzip rsync bc cpio file wget python3

      # GitHub's runners support KVM but the device isn't open to the
      # runner user by default. With it, the VM boots in a few seconds.
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Source tarballs (kernel, Mesa, ...) only change when the Buildroot
      # version or the image config does. The build itself always runs from
      # scratch, so CI proves a fresh clone can build.
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('Makefile', 'buildroot/configs/perkinsos_defconfig') }}
          restore-keys: dl-

      - name: Build image
        run: make image

      - name: Boot test (login prompt, log in, power off)
        run: make test

      - name: Desktop test (keybindings, layer-shell, launcher, app, maximize)
        run: make test-desktop

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: output/*-test.png
          if-no-files-found: ignore

  # The desktop on Ubuntu 26.04 (distro/, docs/PLAN-DAILY-DRIVER.md): the
  # same compositor/ and shell/ source as the image, built against Ubuntu's
  # own wlroots and libraries instead of Buildroot's. This is what
  # distro/vm.sh and distro/usb.sh install, so a change that builds in the
  # image but not on Ubuntu fails here, in minutes, not on the laptop.
  distro:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The build packages listed at the top of distro/Makefile. Nothing
      # else: the container starts with almost nothing installed, so a
      # package missing from that list fails here.
      - name: Install Ubuntu's build packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libwlroots-0.19-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libcairo2-dev

      - name: Build the compositor and shell
        run: make -C distro

      # Into a folder, not the system: checks every file `install` copies
      # exists, without needing root or a running systemd.
      - name: Install into a staging folder
        run: |
          make -C distro install DESTDIR="$PWD/stage"
          make -C distro install-login DESTDIR="$PWD/stage"
          ls -R stage | head -50

      - name: Check the distro scripts parse
        run: |
          for f in distro/*.sh; do bash -n "$f"; done
          sh -n distro/perkinsos-start
